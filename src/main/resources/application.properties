# Server configuration
spring.application.name=autoloc-api
server.port=8081
server.servlet.context-path=/api

# Datasource H2 persistante sur disque (demarrage sans MySQL).
# Pour MySQL, commenter la section H2 et decommenter la section MySQL.
spring.datasource.url=jdbc:h2:file:./data/autolocdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Section MySQL (Ateliers 3-5, si serveur disponible) :
# spring.datasource.url=jdbc:mysql://localhost:3306/autolocdb?createDatabaseIfNotExist=true&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
spring.jackson.serialization.fail-on-empty-beans=false
spring.devtools.restart.enabled=false
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
